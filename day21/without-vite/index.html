<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Intro</title>
    <style>
      .card {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 16px;
        max-width: 300px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin: 16px auto;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Hello, React!</h1>
    </div>
    <div id="root"></div>
  </body>
  <script
    crossorigin
    src="https://unpkg.com/react@18/umd/react.production.min.js"
  ></script>
  <script
    crossorigin
    src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
  ></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    // React Code goes here
    console.log("React is ready to use!");
    console.log("React: ", React);
    console.log("ReactDOM: ", ReactDOM);

    const divElement = document.createElement("div"); // Native JS way. This will be an actual Native DOM element.

    const div = React.createElement(
      "div",
      null,
      "This is a div created using React!"
    ); // React way. This is a React Element.

    console.log("div: ", div);

    const card = React.createElement(
      "div",
      {
        className: "card",
        id: "blog-card",
      },
      [
        React.createElement(
          "img",
          {
            src: "https://images.unsplash.com/photo-1761839257870-06874bda71b5?w=400&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxfHx8ZW58MHx8fHx8",
            alt: "Blog Post Image",
            style: { width: "150px", height: "150px" },
          },
          null
        ),
        React.createElement("h2", null, "Blog Post Title"),
        React.createElement("p", null, "This is the content of the blog post."),
      ]
    );

    // Convert Card UI to JSX
    const NewCardLayout = function () {
      return (
        <div className="card" id="blog-card">
          <img
            src="https://images.unsplash.com/photo-1761839257870-06874bda71b5?w=400&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxfHx8ZW58MHx8fHx8"
            alt="Blog Post Image"
          />
          <h2>Blog Post Title</h2>
          <p>This is the content of the blog post.</p>
        </div>
      );
    };

    console.log("newCardLayout: ", NewCardLayout());

    const rootNode = ReactDOM.createRoot(document.getElementById("root"));
    // rootNode.render(NewCardLayout());
    rootNode.render(<NewCardLayout />);
  </script>
</html>
